name: Compilar App Nativa iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Compilar IPA de ScreenMirrorApp
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto con XcodeGen y Resolver SPM
        run: |
          cd ios
          xcodegen generate
          echo "=== Esquemas detectados ==="
          xcodebuild -project ScreenMirrorApp.xcodeproj -list
          echo "=== Resolviendo dependencias de paquetes Swift ==="
          xcodebuild -resolvePackageDependencies -project ScreenMirrorApp.xcodeproj

      - name: Compilar Binario con xcodebuild
        run: |
          cd ios
          set -o pipefail
          xcodebuild build \
            -project ScreenMirrorApp.xcodeproj \
            -scheme ScreenMirrorApp \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            BUILD_DIR="$(pwd)/build" 2>&1 | tee build.log

      - name: Extraer y Reportar Errores
        if: failure()
        run: |
          cd ios
          echo "### ❌ Log de compilacion:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          cp build.log ../build-error.txt
          cd ..
          git add build-error.txt
          git commit -m "Auto: Log de error exacto" || true
          git push origin debug-log --force || true

      - name: Empaquetar archivo .IPA
        if: success()
        run: |
          cd ios
          APP_PATH=$(find build -name "ScreenMirrorApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ScreenMirrorApp.app" -type d | head -n 1)
          fi
          
          echo "App encontrada en: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No se encontro archivo ScreenMirrorApp.app"
            exit 1
          fi
          
          echo "=== Asegurando que WebRTC.framework este en Frameworks de la App ==="
          mkdir -p "$APP_PATH/Frameworks"
          if [ ! -d "$APP_PATH/Frameworks/WebRTC.framework" ]; then
            echo "WebRTC.framework no esta en $APP_PATH/Frameworks. Buscando..."
            WEBRTC_SOURCE=$(find build ~/Library/Developer/Xcode/DerivedData -name "WebRTC.framework" -type d 2>/dev/null | grep -v "simulator" | head -n 1)
            if [ -n "$WEBRTC_SOURCE" ]; then
              echo "Copiando WebRTC.framework desde: $WEBRTC_SOURCE"
              cp -R "$WEBRTC_SOURCE" "$APP_PATH/Frameworks/"
            else
              echo "Descargando XCFramework de WebRTC..."
              curl -sL "https://github.com/stasel/WebRTC/releases/download/152.0.0/WebRTC-M152.xcframework.zip" -o webrtc.zip
              unzip -q webrtc.zip
              cp -R WebRTC.xcframework/ios-arm64/WebRTC.framework "$APP_PATH/Frameworks/"
              rm -rf webrtc.zip WebRTC.xcframework
            fi
          fi
          
          echo "=== Contenido de Frameworks ==="
          ls -la "$APP_PATH/Frameworks"
          
          echo "=== Verificando Info.plist de la extension ==="
          plutil -p "$APP_PATH/PlugIns/ScreenMirrorExtension.appex/Info.plist"
          
          rm -rf Payload ScreenMirrorApp.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q ScreenMirrorApp.ipa Payload
          echo "IPA generado exitosamente!"
          ls -lh ScreenMirrorApp.ipa

      - name: Subir instalador IPA como Artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenMirrorApp-Instalador-iOS
          path: ios/ScreenMirrorApp.ipa
          retention-days: 30

      - name: Publicar Release directa en GitHub (.IPA)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "ScreenMirrorApp v1.0.4 (.IPA)"
          body: |
            ### 📺 ScreenMirrorApp v1.0.4 - Instalador iOS
            - 🎯 Incrustación obligatoria de WebRTC.framework en el paquete IPA (soluciona cierre inmediato / nunca graba al tocar Start Broadcast).
            - ⚡ Selector nativo dinámico de ReplayKit para preseleccionar directamente ScreenMirror.
            - 🚀 Sincronización WebRTC inmediata y auto-descubrimiento HTTP de sala activa para cuentas gratuitas de Apple ID.
            
            Descarga el archivo `ScreenMirrorApp.ipa` para instalarlo en tu iPhone con Sideloadly o AltStore.
          files: ios/ScreenMirrorApp.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
