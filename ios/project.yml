name: ScreenMirrorApp
options:
  bundleIdPrefix: com.matias.screenmirror

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    branch: latest
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift.git
    from: 16.1.0

targets:
  ScreenMirrorApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ScreenMirrorApp
    dependencies:
      - target: ScreenMirrorExtension
      - package: WebRTC
    info:
      path: ScreenMirrorApp/Info.plist
      properties:
        CFBundleDisplayName: "ScreenMirror"
        CFBundleIdentifier: "com.matias.screenmirror"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Necesitamos acceso a tu red Wi-Fi local para conectar y transmitir la pantalla a tu PC o Smart TV en tiempo real."
        NSCameraUsageDescription: "Necesitamos acceso a la cámara para escanear el código QR de emparejamiento."
    entitlements:
      path: ScreenMirrorApp/ScreenMirrorApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matias.screenmirror
        PRODUCT_NAME: ScreenMirrorApp
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ScreenMirrorApp/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: "Manual"
        DEVELOPMENT_TEAM: ""

  ScreenMirrorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ScreenMirrorExtension
    dependencies:
      - package: WebRTC
      - package: SocketIO
        product: SocketIO
    info:
      path: ScreenMirrorExtension/Info.plist
      properties:
        CFBundleDisplayName: "ScreenMirror Extension"
        CFBundleIdentifier: "com.matias.screenmirror.extension"
        CFBundlePackageType: "XPC!"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Necesitamos acceso a tu red Wi-Fi local para conectar y transmitir la pantalla a tu PC o Smart TV en tiempo real."
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.broadcast-services-upload"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: "RPBroadcastProcessModeSampleBuffers"
    entitlements:
      path: ScreenMirrorExtension/ScreenMirrorExtension.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matias.screenmirror.extension
        PRODUCT_NAME: ScreenMirrorExtension
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ScreenMirrorExtension/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: "Manual"
        DEVELOPMENT_TEAM: ""

schemes:
  ScreenMirrorApp:
    build:
      targets:
        ScreenMirrorApp: all
        ScreenMirrorExtension: all
